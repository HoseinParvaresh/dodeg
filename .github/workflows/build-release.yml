name: Build release APK

# ساخت APK امضاشده برای آپلود در بازار و مایکت (یک APK برای هر دو).
# پیش‌نیاز: دو Secret با نام KEYSTORE_BASE64 و KEYSTORE_PASSWORD (راهنما: native/CLOUD_BUILD.md)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (عدد صحیح؛ در هر آپدیت بیشتر شود)'
        required: true
        default: '1'
      version_name:
        description: 'versionName (مثل 1.0)'
        required: true
        default: '1.0'
      tapsell_app_key:
        description: 'کلید برنامه‌ی تپسل (خالی = کلید تست)'
        required: false
        default: ''
      tapsell_version:
        description: 'نسخه‌ی تپسل (خالی = خودکار)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        shell: bash
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::Secret های KEYSTORE_BASE64 و KEYSTORE_PASSWORD ساخته نشده‌اند. اول workflow «Create keystore» را اجرا کنید (راهنما: native/CLOUD_BUILD.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find Tapsell version
        id: ver
        shell: bash
        run: |
          set -e
          TAP="${{ github.event.inputs.tapsell_version }}"
          if [ -z "$TAP" ]; then
            TAP=$(curl -fsSL https://repo1.maven.org/maven2/ir/tapsell/tapsell/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          fi
          if [ -z "$TAP" ]; then echo "::error::نسخه‌ی تپسل پیدا نشد؛ آن را در ورودی tapsell_version بنویسید"; exit 1; fi
          echo "Tapsell = $TAP"
          echo "tapsell=$TAP" >> "$GITHUB_OUTPUT"

      - name: Install Capacitor (pinned to v7)
        shell: bash
        run: |
          rm -rf node_modules package-lock.json android www
          npm pkg delete dependencies devDependencies || true
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project
        run: |
          npm run web
          npx cap add android
          npm run install-native

      - name: Apply app icon and splash
        run: |
          pip install pillow
          python3 scripts/apply_icon.py

      - name: Restore keystore
        shell: bash
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.jks

      - name: Patch Gradle
        env:
          TAPSELL_VERSION: ${{ steps.ver.outputs.tapsell }}
          TAPSELL_APP_KEY: ${{ github.event.inputs.tapsell_app_key }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          ENABLE_SIGNING: 'true'
        run: node scripts/patch-gradle.mjs

      - name: Build release APK
        working-directory: android
        env:
          DODGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DODGE_KEY_ALIAS: dodge
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        shell: bash
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          for f in android/app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "$f" | head -3 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dodge-release-apk
          path: android/app/build/outputs/apk/release/*.apk
