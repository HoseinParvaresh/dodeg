name: Build APK

# ساخت ابری APK تستی — لازم نیست Android Studio نصب باشد.
# GitHub → تب Actions → «Build APK» → Run workflow

on:
  workflow_dispatch:
    inputs:
      tapsell_version:
        description: 'نسخه‌ی کتابخانه‌ی تپسل (خالی = آخرین نسخه خودکار)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Find Tapsell version
        id: ver
        shell: bash
        run: |
          set -e
          TAP="${{ github.event.inputs.tapsell_version }}"
          if [ -z "$TAP" ]; then
            TAP=$(curl -fsSL https://repo1.maven.org/maven2/ir/tapsell/tapsell/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+' | head -1 || true)
          fi
          if [ -z "$TAP" ]; then echo "::error::نسخه‌ی تپسل پیدا نشد؛ آن را در ورودی tapsell_version بنویسید"; exit 1; fi
          echo "Tapsell = $TAP"
          echo "tapsell=$TAP" >> "$GITHUB_OUTPUT"

      - name: Install Capacitor (pinned to v7)
        shell: bash
        run: |
          rm -rf node_modules package-lock.json android www
          npm pkg delete dependencies devDependencies || true
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project
        run: |
          npm run web
          npx cap add android
          npm run install-native

      - name: Apply app icon and splash
        run: |
          pip install pillow
          python3 scripts/apply_icon.py

      - name: Patch Gradle
        env:
          TAPSELL_VERSION: ${{ steps.ver.outputs.tapsell }}
        run: node scripts/patch-gradle.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dodge-apk
          path: android/app/build/outputs/apk/debug/*.apk
