name: Create keystore

# فقط یک‌بار اجرا کنید. کلید امضای برنامه را می‌سازد؛ برای همیشه به آن نیاز دارید.
# خروجی: فایل‌های dodge-release.jks و keystore-secrets.txt (فقط ۱ روز نگه داشته می‌شود).

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        shell: bash
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore dodge-release.jks -storetype PKCS12 \
            -alias dodge -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=hparvaresh, O=hparvaresh, C=IR" > /dev/null
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=dodge"
            echo ""
            echo "KEYSTORE_BASE64 (کل خط بعدی را کپی کنید):"
            base64 -w0 dodge-release.jks
            echo ""
          } > keystore-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dodge-keystore
          path: |
            dodge-release.jks
            keystore-secrets.txt
          retention-days: 1
